<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sticky Wall</title>
    <link rel="stylesheet" href="./assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
        integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <!-- ==================== Left Sidebar ======================== -->
    <aside class="sidebar">
        <!-- == header siderbar == -->
        <header class="sidebar-header">
            <h3>Menu</h3>
            <a href="#"><i class="fa-solid fa-bars"></i></a>
        </header>
        <!-- == liste sidebar == -->
        <section class="lists-section">
            <h5>Lists</h5>
            <ul class="lists-list">
                <li class="list-item">
                    <a href="#" class="green-box-list">
                        <i class="fa-solid fa-square"></i>
                        <p>School</p>
                        <span>3</span>
                    </a>
                </li>
                <li class="list-item">
                    <a href="#" class="orange-box-list">
                        <i class="fa-solid fa-square"></i>
                        <p>Trip over the Moroccan coast</p>
                        <span>3</span>
                    </a>
                </li>
                <li class="list-item">
                    <a href="#" class="green-box-list">
                        <i class="fa-solid fa-square"></i>
                        <p>Home</p>
                        <span>3</span>
                    </a>
                </li>
                <li class="list-item">
                    <a href="#" class="orange-box-list">
                        <i class="fa-solid fa-square"></i>
                        <p>CV - Projects</p>
                        <span>1</span>
                    </a>
                </li>
                <li class="list-item add-list-button">
                    <a href="#">
                        <i class="fa-solid fa-plus"></i>
                        <p>Add New List</p>
                    </a>
                </li>

            </ul>
        </section>
        <!-- == hr line ==  -->
        <hr>
        <!-- == tage section == -->
        <section class="tag-section">
            <h5>tags</h5>
            <div class="tags-container">
                <a href="#" class="tag-button tag-orange">Tag 1</a>
                <a href="#" class="tag-button">Tag 2</a>
                <a href="#" class="tag-button add-new-tag">+ Add New Tag</a>
            </div>
        </section>
    </aside>

</body>

</html>
